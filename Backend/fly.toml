# fly.toml app configuration file generated for nmu-shuttle-api on 2026-10-17T15:09:42+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nmu-shuttle-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always running so there is no ~10s cold-start boot on the
  # first request after idle, and so the nightly background jobs run reliably.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
