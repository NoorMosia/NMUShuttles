<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NMU Shuttle — book and manage campus shuttle trips.">

  <!-- Social media cards (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NMU Shuttle">
  <meta property="og:title" content="NMU Shuttle — Student &amp; Marshal App">
  <meta property="og:description" content="Book and manage campus shuttle trips at Nelson Mandela University.">
  <meta property="og:url" content="https://noormosia.github.io/NMUShuttles/app/">
  <meta property="og:image" content="https://noormosia.github.io/NMUShuttles/app/social-card.png">
  <meta property="og:image:width" content="1500">
  <meta property="og:image:height" content="1500">
  <meta property="og:image:alt" content="NMU Shuttle logo">

  <!-- Social media cards (Twitter / X) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="NMU Shuttle — Student &amp; Marshal App">
  <meta name="twitter:description" content="Book and manage campus shuttle trips at Nelson Mandela University.">
  <meta name="twitter:image" content="https://noormosia.github.io/NMUShuttles/app/social-card.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NMU Shuttle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (SVG preferred, PNG fallback) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NMU Shuttle</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API — required by the `google_maps_flutter_web`
    plugin so the MapsScreen renders on web. The key below is the Maps SDK
    key also used by the Android app (AndroidManifest.xml). For production,
    restrict this key by HTTP referrer in the Google Cloud console and make
    sure the "Maps JavaScript API" is enabled for the project.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA51uPs7hqf16hBT1BHICvJR-z7_azh4pk" async defer></script>

  <style>
    /* Branded loading screen shown instantly while the Flutter engine
       downloads/initialises, so first-time visitors don't see a blank page.
       Flutter paints over #loading once it's ready; we then remove it. */
    html, body { margin: 0; padding: 0; height: 100%; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #132e51; /* navy */
      transition: opacity 0.35s ease;
      z-index: 9999;
    }
    #loading img { width: 96px; height: 96px; margin-bottom: 24px; }
    #loading .spinner {
      width: 36px; height: 36px;
      border: 4px solid rgba(255, 204, 0, 0.3); /* gold, faded */
      border-top-color: #ffcc00;                /* gold */
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Instant branded splash; replaced by the Flutter app once it loads. -->
  <div id="loading">
    <img src="icons/Icon-192.png" alt="NMU Shuttle" />
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove the splash once Flutter's first frame is rendered.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
