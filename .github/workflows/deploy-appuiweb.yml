name: Deploy Flutter web apps to GitHub Pages

# Builds BOTH Flutter web apps and publishes them under one GitHub Pages site:
#   https://noormosia.github.io/NMUShuttles/app/    -> AppUIWeb   (student/marshal)
#   https://noormosia.github.io/NMUShuttles/admin/  -> WebPortalUI (admin portal)
#
# A repo has only one Pages site, so both apps are assembled into a single
# artifact (different subfolders) and deployed together.
#
# AppUIWeb depends on ../AppUI via a path dependency, so the whole repo is
# checked out and each build runs from inside its own app folder.

on:
  push:
    branches: [deploy]        # change to main if you prefer
    paths:
      - 'AppUIWeb/**'
      - 'AppUI/**'
      - 'WebPortalUI/**'
      - '.github/workflows/deploy-appuiweb.yml'
  workflow_dispatch:           # allows manual runs from the Actions tab

# Permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer run cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the local SDK used to develop the apps.
          flutter-version: 3.44.8

      # --- Student/Marshal app (AppUIWeb) -> /app/ ---
      - name: Build AppUIWeb
        working-directory: AppUIWeb
        run: |
          flutter pub get
          flutter build web --release --base-href /NMUShuttles/app/ --no-tree-shake-icons

      # --- Admin portal (WebPortalUI) -> /admin/ ---
      - name: Build WebPortalUI
        working-directory: WebPortalUI
        run: |
          flutter pub get
          flutter build web --release --base-href /NMUShuttles/admin/ --no-tree-shake-icons

      # --- Assemble both builds into one publish directory ---
      - name: Assemble site
        run: |
          set -euo pipefail
          # Fail loudly if either build is missing its entry point.
          test -f AppUIWeb/build/web/index.html    || { echo "AppUIWeb build missing"; exit 1; }
          test -f WebPortalUI/build/web/index.html || { echo "WebPortalUI build missing"; exit 1; }

          mkdir -p public/app public/admin
          cp -a AppUIWeb/build/web/.    public/app/
          cp -a WebPortalUI/build/web/. public/admin/

          # Social-media card image for the root landing page.
          cp assets/logos/1.png public/social-card.png

          # Favicon for the root landing page (reuse the brand logo).
          cp assets/logos/1.png public/favicon.png

          echo "----- public/ tree -----"
          ls -la public
          echo "----- public/app -----"
          ls -la public/app | head
          echo "----- public/admin -----"
          ls -la public/admin | head
          test -f public/app/index.html   || { echo "app/index.html not assembled"; exit 1; }
          test -f public/admin/index.html || { echo "admin/index.html not assembled"; exit 1; }
          # Landing page at the site root: product overview, architecture,
          # team credits, and links to each app.
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>NMU Shuttle — Campus Transit Platform</title>
            <meta name="description" content="NMU Shuttle — book and manage campus shuttle trips at Nelson Mandela University.">

            <!-- Favicon -->
            <link rel="icon" type="image/png" href="favicon.png">
            <link rel="apple-touch-icon" href="favicon.png">

            <!-- Social media cards (Open Graph) -->
            <meta property="og:type" content="website">
            <meta property="og:site_name" content="NMU Shuttle">
            <meta property="og:title" content="NMU Shuttle">
            <meta property="og:description" content="Book and manage campus shuttle trips at Nelson Mandela University.">
            <meta property="og:url" content="https://noormosia.github.io/NMUShuttles/">
            <meta property="og:image" content="https://noormosia.github.io/NMUShuttles/social-card.png">
            <meta property="og:image:width" content="1500">
            <meta property="og:image:height" content="1500">
            <meta property="og:image:alt" content="NMU Shuttle logo">

            <!-- Social media cards (Twitter / X) -->
            <meta name="twitter:card" content="summary">
            <meta name="twitter:title" content="NMU Shuttle">
            <meta name="twitter:description" content="Book and manage campus shuttle trips at Nelson Mandela University.">
            <meta name="twitter:image" content="https://noormosia.github.io/NMUShuttles/social-card.png">

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
            <style>
              :root{
                --gold:#ffcc00; --navy:#132e51; --navy-700:#254f88;
                --ink:#0e2440; --paper:#ffffff; --mist:#f4f6fa;
                --line:#e2e8f2; --muted:#5b6b82;
              }
              *{box-sizing:border-box;margin:0;padding:0;}
              html{scroll-behavior:smooth;}
              body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);
                    color:var(--ink);line-height:1.5;}
              a{color:inherit;}
              .wrap{max-width:1040px;margin:0 auto;padding:0 24px;}
              .section-title{display:flex;align-items:center;gap:12px;font-size:1.6rem;
                    font-weight:800;color:var(--navy);margin-bottom:8px;}
              .section-title .bar{width:7px;height:28px;background:var(--gold);border-radius:3px;}
              .lead{color:var(--muted);font-weight:500;max-width:70ch;margin-bottom:28px;}
              section{padding:56px 0;border-top:1px solid var(--line);}

              /* ---------- Hero ---------- */
              .hero{background:var(--navy);color:#fff;position:relative;border-top:none;
                    padding:64px 0 72px;}
              .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--gold);}
              .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,204,0,.16);
                    color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
                    font-size:.72rem;padding:7px 15px;border-radius:999px;}
              .hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:900;line-height:1.04;
                    margin-top:18px;letter-spacing:-.01em;}
              .hero h1 span{color:var(--gold);}
              .hero p{font-size:1.1rem;color:#c7d4e6;margin-top:16px;max-width:60ch;font-weight:500;}
              .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;}
              .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;
                    border-radius:10px;font-weight:700;text-decoration:none;transition:transform .12s ease;}
              .btn:hover{transform:translateY(-2px);}
              .btn-gold{background:var(--gold);color:var(--navy);}
              .btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);}
              .meta{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap;}
              .meta div{font-size:.85rem;color:#9fb2cc;font-weight:500;}
              .meta b{display:block;color:#fff;font-size:1rem;font-weight:800;margin-bottom:2px;}

              /* ---------- Problem ---------- */
              .problem{background:var(--mist);border-top:none;}
              .problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
              .problem-grid .q{font-size:1.15rem;font-weight:700;color:var(--navy);}
              .problem-grid p{color:var(--muted);font-weight:500;}
              .problem-grid p + p{margin-top:12px;}

              /* ---------- Features ---------- */
              .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
              .card{border:1.5px solid var(--line);border-radius:14px;padding:22px;background:#fff;}
              .card .ic{width:44px;height:44px;border-radius:11px;background:var(--navy);color:var(--gold);
                    display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
              .card h3{font-size:1.05rem;font-weight:800;color:var(--ink);margin:14px 0 6px;}
              .card p{font-size:.92rem;color:var(--muted);font-weight:500;}

              /* ---------- Flow ---------- */
              .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
                    border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
              .step{padding:22px 18px;background:#fff;}
              .step:not(:last-child){border-right:1.5px solid var(--line);}
              .step .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);
                    font-weight:900;display:flex;align-items:center;justify-content:center;}
              .step h4{font-size:1rem;font-weight:800;margin-top:12px;color:var(--navy);}
              .step p{font-size:.86rem;color:var(--muted);margin-top:5px;font-weight:500;}

              /* ---------- Architecture ---------- */
              .arch{display:flex;flex-direction:column;gap:14px;}
              .tier-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
              .row{display:grid;gap:14px;}
              .row.three{grid-template-columns:repeat(3,1fr);}
              .row.one{grid-template-columns:1fr;}
              .node{border:1.5px solid var(--line);border-radius:13px;padding:16px 18px;background:#fff;}
              .node h4{font-size:1rem;font-weight:800;color:var(--ink);}
              .node p{font-size:.85rem;color:var(--muted);margin-top:3px;font-weight:500;}
              .node.api{background:var(--navy);border-color:var(--navy);}
              .node.api h4{color:#fff;}.node.api p{color:#c7d4e6;}
              .arrow{text-align:center;color:var(--navy-700);font-size:1.3rem;font-weight:700;}
              .conn-note{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);}
              .stack{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
              .chip{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--mist);text-align:center;}
              .chip b{display:block;font-size:.98rem;font-weight:800;color:var(--ink);}
              .chip span{font-size:.8rem;color:var(--muted);font-weight:500;}

              /* ---------- Team ---------- */
              .team{background:var(--mist);border-top:none;}
              .team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
              .member{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:22px;text-align:center;}
              .avatar{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--gold);
                    font-weight:900;font-size:1.4rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
              .member h4{font-size:1rem;font-weight:800;color:var(--ink);}
              .member small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px;font-weight:600;}
              .links{display:flex;justify-content:center;gap:10px;margin-top:14px;}
              .links a{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;
                    text-decoration:none;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line);color:var(--navy);}
              .links a:hover{background:var(--gold);border-color:var(--gold);}

              /* ---------- Footer ---------- */
              footer{background:var(--navy);color:#c7d4e6;border-top:none;padding:40px 0;}
              footer .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
              footer .brand{display:flex;align-items:center;gap:14px;}
              footer .dot{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--navy);
                    font-weight:900;font-size:1.2rem;display:flex;align-items:center;justify-content:center;}
              footer b{color:#fff;font-size:1.05rem;}
              footer small{display:block;font-size:.82rem;}

              @media (max-width:900px){
                .features,.team-grid,.stack{grid-template-columns:repeat(2,1fr);}
                .flow,.row.three{grid-template-columns:1fr;}
                .step:not(:last-child){border-right:none;border-bottom:1.5px solid var(--line);}
                .problem-grid{grid-template-columns:1fr;}
              }
              @media (max-width:560px){
                .features,.team-grid,.stack{grid-template-columns:1fr;}
              }
            </style>
          </head>
          <body>

            <!-- HERO -->
            <header class="hero">
              <div class="wrap">
                <span class="kicker">Campus Transit Platform</span>
                <h1>NMU Shuttle <span>Management Network</span></h1>
                <p>A booking and boarding system that coordinates daily shuttles between off-campus
                   residences and Nelson Mandela University campuses — built for students, marshals,
                   and administrators.</p>
                <div class="cta">
                  <a class="btn btn-gold" href="app/">Student / Marshal App</a>
                  <a class="btn btn-ghost" href="admin/">Admin Portal</a>
                </div>
                <div class="meta">
                  <div><b>3 roles</b>Student · Marshal · Admin</div>
                  <div><b>QR boarding</b>Scan-to-verify check-in</div>
                  <div><b>Priority access</b>Disability-cleared pre-booking</div>
                  <div><b>Automated ops</b>Nightly trip generation</div>
                </div>
              </div>
            </header>

            <!-- PROBLEM -->
            <section class="problem">
              <div class="wrap">
                <div class="section-title"><span class="bar"></span>The Problem We Solve</div>
                <div class="problem-grid">
                  <div>
                    <p class="q">Getting students between home and campus was manual, crowded, and hard to trust.</p>
                  </div>
                  <div>
                    <p>Shuttle seats were first-come-first-served with no reliable way to reserve a spot,
                       verify who boards, or give accessibility-cleared students a guaranteed seat.</p>
                    <p>NMU Shuttle replaces that with reserved seats, QR-verified boarding, automatic
                       waitlists, priority pre-booking for disability-cleared students, and live handling
                       of breakdowns — so a daily commute is predictable for riders and manageable for staff.</p>
                  </div>
                </div>
              </div>
            </section>

            <!-- FEATURES -->
            <section>
              <div class="wrap">
                <div class="section-title"><span class="bar"></span>What It Does</div>
                <p class="lead">Six capabilities cover the full journey — from booking a seat to boarding a vehicle.</p>
                <div class="features">
                  <div class="card"><div class="ic">&#128657;</div><h3>Seat Booking</h3>
                    <p>Book a seat on scheduled trips up to 3 days ahead and get a QR boarding pass. A waitlist fills automatically when a trip is full.</p></div>
                  <div class="card"><div class="ic">&#9855;</div><h3>Priority Accessibility</h3>
                    <p>Disability-cleared students get automatic recurring pre-bookings, assigned to the front accessible shuttles in the convoy.</p></div>
                  <div class="card"><div class="ic">&#128247;</div><h3>Marshal Check-In</h3>
                    <p>Field marshals scan passenger QR codes to verify boarding. Scanning opens 35 minutes before departure.</p></div>
                  <div class="card"><div class="ic">&#128202;</div><h3>Admin Portal</h3>
                    <p>Full control over stops, shuttles, users, schedules and calendar exceptions — plus vendor reliability analytics and report handling.</p></div>
                  <div class="card"><div class="ic">&#9889;</div><h3>Automated Operations</h3>
                    <p>A nightly job creates trips 3 days ahead and injects priority bookings. A lockout gate locks trips at T-60 and promotes the waitlist.</p></div>
                  <div class="card"><div class="ic">&#128295;</div><h3>Breakdown Handling</h3>
                    <p>A marshal flags a broken shuttle, an admin resolves it (replace or cancel), and affected riders get a push notification only after resolution.</p></div>
                </div>
              </div>
            </section>

            <!-- FLOW -->
            <section>
              <div class="wrap">
                <div class="section-title"><span class="bar"></span>How a Trip Works</div>
                <p class="lead">From reservation to boarding, each trip moves through four stages.</p>
                <div class="flow">
                  <div class="step"><div class="n">1</div><h4>Book</h4><p>Student reserves a seat and gets a QR pass, up to 3 days ahead.</p></div>
                  <div class="step"><div class="n">2</div><h4>Lock</h4><p>At T-60 min the trip locks and the waitlist is promoted FIFO.</p></div>
                  <div class="step"><div class="n">3</div><h4>Scan</h4><p>From T-35 min the marshal scans passengers at the boarding point.</p></div>
                  <div class="step"><div class="n">4</div><h4>Board</h4><p>Riders fill the front shuttle first across the convoy.</p></div>
                </div>
              </div>
            </section>

            <!-- ARCHITECTURE -->
            <section>
              <div class="wrap">
                <div class="section-title"><span class="bar"></span>Architecture</div>
                <p class="lead">A Flutter front end across mobile and web, a .NET 9 REST API, and a SQL database —
                   connected by JWT auth, push notifications, and automated background jobs.</p>
                <div class="arch">
                  <div class="tier-label">Clients</div>
                  <div class="row three">
                    <div class="node"><h4>Student App</h4><p>Flutter · Android</p></div>
                    <div class="node"><h4>Marshal App</h4><p>Flutter · Android (role-switched)</p></div>
                    <div class="node"><h4>Admin Portal</h4><p>Flutter Web</p></div>
                  </div>
                  <div class="conn-note">HTTPS · JSON · JWT Bearer tokens</div>
                  <div class="arrow">&#8595;</div>
                  <div class="tier-label">Application</div>
                  <div class="row one">
                    <div class="node api"><h4>.NET 9 Web API · /api/v1</h4>
                      <p>Controllers · Services · DTOs · FluentValidation · JWT role guards (Student / Marshal / Admin) · EF Core · Background services: nightly rolling trip job + T-60 lockout gate</p></div>
                  </div>
                  <div class="arrow">&#8595;</div>
                  <div class="tier-label">Data &amp; External Services</div>
                  <div class="row three">
                    <div class="node"><h4>SQL Database</h4><p>EF Core code-first</p></div>
                    <div class="node"><h4>Firebase FCM</h4><p>Push notifications</p></div>
                    <div class="node"><h4>Resend</h4><p>OTP email delivery</p></div>
                  </div>
                </div>
                <div class="stack">
                  <div class="chip"><b>Flutter</b><span>Mobile + Web · Material 3</span></div>
                  <div class="chip"><b>.NET 9</b><span>ASP.NET Core Web API</span></div>
                  <div class="chip"><b>SQL + EF Core</b><span>Code-first migrations</span></div>
                  <div class="chip"><b>JWT Auth</b><span>3 roles · OTP + password</span></div>
                </div>
              </div>
            </section>

            <!-- TEAM -->
            <section class="team">
              <div class="wrap">
                <div class="section-title"><span class="bar"></span>Built By</div>
                <p class="lead">This system was designed and built by four developers.</p>
                <div class="team-grid">
                  <div class="member">
                    <div class="avatar">LN</div>
                    <h4>Lusanda Ngubeni</h4><small>Developer</small>
                    <div class="links">
                      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
                      <a href="#" target="_blank" rel="noopener">GitHub</a>
                    </div>
                  </div>
                  <div class="member">
                    <div class="avatar">AS</div>
                    <h4>Anele Sombo</h4><small>Developer</small>
                    <div class="links">
                      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
                      <a href="#" target="_blank" rel="noopener">GitHub</a>
                    </div>
                  </div>
                  <div class="member">
                    <div class="avatar">LS</div>
                    <h4>Letlhogonolo Setati</h4><small>Developer</small>
                    <div class="links">
                      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
                      <a href="#" target="_blank" rel="noopener">GitHub</a>
                    </div>
                  </div>
                  <div class="member">
                    <div class="avatar">TM</div>
                    <h4>Tshepo Noor Mosia</h4><small>Developer</small>
                    <div class="links">
                      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
                      <a href="https://github.com/noormosia" target="_blank" rel="noopener">GitHub</a>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- FOOTER -->
            <footer>
              <div class="wrap inner">
                <div class="brand">
                  <div class="dot">N</div>
                  <div><b>NMU Shuttle</b><small>Nelson Mandela University · Gqeberha, South Africa</small></div>
                </div>
                <div>
                  <a class="btn btn-gold" href="app/" style="margin-right:10px;">Open the App</a>
                  <a class="btn btn-ghost" href="admin/">Admin Portal</a>
                </div>
              </div>
            </footer>

          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
