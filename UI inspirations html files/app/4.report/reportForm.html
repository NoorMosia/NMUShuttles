<style>

<body class="min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="w-full top-0 border-b border-outline-variant/20 flex items-center px-margin-mobile h-16 sticky bg-white z-40"><button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5 transition-colors" aria-label="Go back">
  <span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>

<h1 class="font-headline-sm text-headline-sm text-on-surface ml-2">Report Issue</h1>
</header>
<main class="flex-grow px-margin-mobile pb-24">
<!-- Hero Trip Context Section -->
<section class="section-gap animate-in fade-in duration-700 slide-in-from-bottom-4">
<p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-4">Selected Journey</p>
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-neutral-dark flex items-center justify-center rounded">
<span class="material-symbols-outlined text-white">directions_bus</span>
</div>
<div>
<h2 class="font-body-lg text-body-lg text-on-surface font-medium">Monday, 24 Oct</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Departure • 08:30 AM</p>
</div>
</div>
</section>
<!-- Categories Section -->
<section class="section-gap">
<h3 class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-6">What happened?</h3>
<div class="space-y-4">
<!-- Vehicle -->
<label class="flex items-center justify-between py-4 cursor-pointer transition-colors group">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface">airport_shuttle</span>
<span class="font-body-lg text-body-lg text-on-surface">Vehicle (includes driver)</span>
</div>
<input class="w-6 h-6 rounded-sm border-2 border-on-surface/20 text-neutral-dark focus:ring-0 issue-checkbox transition-all" type="checkbox">
</label>
<!-- Marshal -->
<label class="flex items-center justify-between py-4 cursor-pointer transition-colors group">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface">badge</span>
<span class="font-body-lg text-body-lg text-on-surface">Marshal</span>
</div>
<input class="w-6 h-6 rounded-sm border-2 border-on-surface/20 text-neutral-dark focus:ring-0 issue-checkbox transition-all" type="checkbox">
</label>
<!-- System -->
<label class="flex items-center justify-between py-4 cursor-pointer transition-colors group">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface">bug_report</span>
<span class="font-body-lg text-body-lg text-on-surface">System (bugs)</span>
</div>
<input class="w-6 h-6 rounded-sm border-2 border-on-surface/20 text-neutral-dark focus:ring-0 issue-checkbox transition-all" type="checkbox">
</label>
<!-- General -->
<label class="flex items-center justify-between py-4 cursor-pointer transition-colors group">
<div class="flex items-center gap-base">
<span class="material-symbols-outlined text-on-surface">chat_bubble</span>
<span class="font-body-lg text-body-lg text-on-surface">General report (feedback)</span>
</div>
<input class="w-6 h-6 rounded-sm border-2 border-on-surface/20 text-neutral-dark focus:ring-0 issue-checkbox transition-all" type="checkbox">
</label>
</div>
</section>
<!-- Additional Comments -->
<section class="section-gap">
<h3 class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-4">Message</h3>
<textarea class="w-full h-32 p-4 border border-on-surface/10 rounded focus:border-on-surface/30 focus:ring-0 font-body-md transition-colors bg-transparent" placeholder="Briefly describe the issue..."></textarea><button class="w-full py-4 mt-8 bg-neutral-dark text-white font-label-md text-label-md font-bold uppercase tracking-widest rounded-button hover:opacity-95 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2">SUBMIT ISSUE</button>
</section>
</main>
<!-- Bottom Action Area -->

<script>
        // Micro-interactions for form submission
        document.querySelector('button.bg-\\[\\#132e51\\]').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-base">progress_activity</span> SENDING...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-base">check_circle</span> SUBMITTED';
                btn.classList.replace('bg-[#132e51]', 'bg-green-700');
                
                setTimeout(() => {
                    // Reset for demo purposes
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-700', 'bg-[#132e51]');
                    btn.disabled = false;
                }, 2000);
            }, 1200);
        });

        // Checkbox interaction: toggle row visual state
        const checkboxes = document.querySelectorAll('.issue-checkbox');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', function() {
                const label = this.closest('label');
                if (this.checked) {
                    label.classList.add('opacity-100');
                } else {
                    label.classList.remove('opacity-100');
                }
            });
        });
    </script>
