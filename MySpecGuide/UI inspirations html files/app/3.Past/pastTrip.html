<script>
        // Micro-interactions
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', (e) => {
                // Prevent navigation for demo
                if(el.tagName === 'A' && el.getAttribute('href') === '#') {
                    e.preventDefault();
                }
                
                // Add a simple haptic-like ripple effect logic (visual only)
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-on-surface/5 rounded-full animate-ping pointer-events-none';
                ripple.style.width = '100%';
                ripple.style.height = '100%';
                el.classList.add('relative', 'overflow-hidden');
                el.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
