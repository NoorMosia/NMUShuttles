<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NMU Shuttle — Poster 1 (Product) · A4</title>
<style>
  /* A4 is the same aspect ratio as A3 (1:√2), so we scale the A3 poster down
     by 210/297 = 0.70707 to fit A4 exactly, with no reflow. */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#54616e;}
  .a4-stage{
    width:210mm;height:297mm;margin:12mm auto;position:relative;overflow:hidden;
    background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  /* The embedded A3 poster is 297x420mm; scale it to fit the A4 stage. */
  iframe{
    width:297mm;height:420mm;border:0;transform:scale(.70707);transform-origin:top left;
    position:absolute;top:0;left:0;
  }
  @media print{
    @page{size:A4 portrait;margin:0;}
    html,body{background:#fff;}
    .a4-stage{margin:0;box-shadow:none;}
  }
</style>
</head>
<body>
  <div class="a4-stage">
    <iframe src="../poster-1-product.html" scrolling="no"></iframe>
  </div>
</body>
</html>
