<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NMU Shuttle Management Admin Portal">

  <!-- Social media cards (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NMU Shuttle">
  <meta property="og:title" content="NMU Shuttle — Admin Portal">
  <meta property="og:description" content="Manage stops, shuttles, schedules, and reports for Nelson Mandela University's shuttle network.">
  <meta property="og:url" content="https://noormosia.github.io/NMUShuttles/admin/">
  <meta property="og:image" content="https://noormosia.github.io/NMUShuttles/admin/social-card.png">
  <meta property="og:image:width" content="1500">
  <meta property="og:image:height" content="1500">
  <meta property="og:image:alt" content="NMU Shuttle logo">

  <!-- Social media cards (Twitter / X) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="NMU Shuttle — Admin Portal">
  <meta name="twitter:description" content="Manage stops, shuttles, schedules, and reports for Nelson Mandela University's shuttle network.">
  <meta name="twitter:image" content="https://noormosia.github.io/NMUShuttles/admin/social-card.png">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NMU Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NMU Shuttle Admin</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
