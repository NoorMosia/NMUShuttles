<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NMU Shuttle — book and manage campus shuttle trips.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NMU Shuttle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NMU Shuttle</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API — required by the `google_maps_flutter_web`
    plugin so the MapsScreen renders on web. The key below is the Maps SDK
    key also used by the Android app (AndroidManifest.xml). For production,
    restrict this key by HTTP referrer in the Google Cloud console and make
    sure the "Maps JavaScript API" is enabled for the project.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA51uPs7hqf16hBT1BHICvJR-z7_azh4pk"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
