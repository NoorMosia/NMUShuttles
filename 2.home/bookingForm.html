<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CampusShuttle - New Booking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#584400",
                    "primary-container": "#ffcc00",
                    "on-primary-fixed": "#241a00",
                    "surface-container-highest": "#ebe1d0",
                    "on-secondary-fixed": "#281900",
                    "surface-variant": "#ebe1d0",
                    "surface": "#ffffff",
                    "on-tertiary-container": "#00646e",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#fdf2e0",
                    "inverse-primary": "#f1c100",
                    "outline-variant": "#d2c5ab",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#ffdeae",
                    "on-background": "#132e51",
                    "surface-bright": "#ffffff",
                    "tertiary-fixed-dim": "#00daf0",
                    "on-surface": "#132e51",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#745b00",
                    "surface-container-high": "#f1e7d5",
                    "secondary-fixed-dim": "#ffba3d",
                    "on-tertiary-fixed": "#001f24",
                    "on-secondary-fixed-variant": "#604100",
                    "background": "#ffffff",
                    "on-surface-variant": "#80765f",
                    "on-tertiary-fixed-variant": "#004f57",
                    "tertiary-container": "#00e7fe",
                    "primary-fixed": "#ffe08b",
                    "on-primary-container": "#6f5700",
                    "on-secondary-container": "#6d4a00",
                    "primary": "#132e51",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#faf0dd",
                    "inverse-surface": "#353024",
                    "primary-fixed-dim": "#f1c100",
                    "surface-container": "#f7eddb",
                    "outline": "#80765f",
                    "tertiary-fixed": "#95f1ff",
                    "tertiary": "#006874",
                    "surface-dim": "#e3d9c7",
                    "error": "#ba1a1a",
                    "error-container": "#ffdad6",
                    "secondary": "#7f5700",
                    "secondary-container": "#feb62f"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "sm": "12px",
                    "lg": "32px",
                    "base": "8px",
                    "unit": "4px",
                    "md": "20px",
                    "margin-mobile": "16px",
                    "xl": "48px",
                    "gutter-mobile": "12px"
            },
            "fontFamily": {
                    "label-sm": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "headline-sm": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "headline-md": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #ffffff;
            color: #132e51;
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .all-caps-label {
            text-transform: uppercase;
            color: #80765f;
            font-size: 11px;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .custom-radio:checked {
            background-color: #132e51;
            border-color: #132e51;
        }
    </style>
</head>
<body class="min-h-screen pb-xl">
<!-- Header -->
<header class="w-full sticky top-0 z-40 bg-white border-b border-outline-variant/20 h-16 flex items-center px-margin-mobile">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="ml-4 font-headline-sm text-headline-sm text-on-surface">New Booking</h1>
</header>
<main class="px-margin-mobile flex flex-col gap-xl max-w-lg mx-auto" style="padding-top: 80px;">
<!-- Direction Selection -->
<section class="flex flex-col gap-sm">
<label class="all-caps-label">Direction</label>
<div class="flex gap-md">
<label class="flex items-center gap-base cursor-pointer group">
<input checked="" class="w-5 h-5 border-2 border-on-surface/20 text-primary focus:ring-0 rounded-full custom-radio" name="direction" type="radio" value="from">
<span class="font-body-md text-body-md">From Campus</span>
</label>
<label class="flex items-center gap-base cursor-pointer group">
<input class="w-5 h-5 border-2 border-on-surface/20 text-primary focus:ring-0 rounded-full custom-radio" name="direction" type="radio" value="to">
<span class="font-body-md text-body-md">To Campus</span>
</label>
</div>
</section>
<!-- Off-Campus Stop -->
<section class="flex flex-col gap-xs">
<label class="all-caps-label">Off-Campus Stop</label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-0 border-b-2 border-on-surface/10 focus:border-on-surface focus:ring-0 px-0 py-sm font-body-md text-body-md transition-all placeholder:text-on-surface-variant/40" placeholder="Search for a stop..." type="text">
<span class="material-symbols-outlined absolute right-0 text-on-surface-variant">map</span>
</div>
</section>
<!-- On-Campus Stop -->
<section class="flex flex-col gap-sm">
<label class="all-caps-label">On-Campus Point</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border-b-2 border-on-surface/10 focus:border-on-surface focus:ring-0 px-0 py-sm font-body-md text-body-md transition-all cursor-pointer">
<option disabled="" selected="" value="">Select Campus Location</option>
<option value="south">South Campus</option>
<option value="north">North Campus</option>
<option value="business">2nd Avenue (NMMU Business School)</option>
</select>
</div>
</section>
<!-- Date Selection -->
<section class="flex flex-col gap-sm">
<label class="all-caps-label">Travel Date</label>
<div class="flex gap-sm overflow-x-auto no-scrollbar py-unit">
<!-- Today -->
<button class="flex-shrink-0 px-md py-sm border-2 border-on-surface bg-on-surface text-white rounded-lg transition-all" onclick="selectDate(this)">
<div class="font-label-sm text-label-sm opacity-70">OCT</div>
<div class="font-headline-sm text-headline-sm">24</div>
<div class="font-label-sm text-label-sm">Today</div>
</button>
<!-- Tomorrow -->
<button class="flex-shrink-0 px-md py-sm border-2 border-on-surface/10 bg-transparent text-on-surface rounded-lg hover:border-on-surface/30 transition-all" onclick="selectDate(this)">
<div class="font-label-sm text-label-sm opacity-50">OCT</div>
<div class="font-headline-sm text-headline-sm">25</div>
<div class="font-label-sm text-label-sm">Fri</div>
</button>
<!-- Sat -->
<button class="flex-shrink-0 px-md py-sm border-2 border-on-surface/10 bg-transparent text-on-surface rounded-lg hover:border-on-surface/30 transition-all" onclick="selectDate(this)">
<div class="font-label-sm text-label-sm opacity-50">OCT</div>
<div class="font-headline-sm text-headline-sm">26</div>
<div class="font-label-sm text-label-sm">Sat</div>
</button>
<!-- Sun -->
<button class="flex-shrink-0 px-md py-sm border-2 border-on-surface/10 bg-transparent text-on-surface rounded-lg hover:border-on-surface/30 transition-all" onclick="selectDate(this)">
<div class="font-label-sm text-label-sm opacity-50">OCT</div>
<div class="font-headline-sm text-headline-sm">27</div>
<div class="font-label-sm text-label-sm">Sun</div>
</button>
</div>
</section>
<!-- Time Selection -->
<section class="flex flex-col gap-sm">
<label class="all-caps-label">Departure Time</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border-b-2 border-on-surface/10 focus:border-on-surface focus:ring-0 px-0 py-sm font-body-md text-body-md transition-all cursor-pointer" id="timeSelect" onchange="toggleCtaState(this.value)">
<option disabled="" selected="" value="">Select Departure Time</option>
<option value="07:30">07:30 AM</option>
<option value="09:00">09:00 AM</option>
<option value="12:00">12:00 PM</option>
<option data-status="full" value="15:30">03:30 PM (Full)</option>
<option value="17:15">05:15 PM</option>
</select>
</div>
</section>
<!-- Conditional CTA Container -->
<section class="mt-lg flex flex-col gap-md">
<div id="confirmCta">
<button class="w-full bg-on-surface text-white py-md font-label-md text-label-md rounded-lg hover:bg-on-surface/90 transition-colors active:scale-[0.98] duration-150">
                    CONFIRM BOOKING
                </button>
</div>
<div class="hidden" id="waitlistCta">
<button class="w-full bg-secondary-container text-on-secondary-container py-md font-label-md text-label-md rounded-lg hover:bg-secondary-container/90 transition-colors flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-md">hourglass_top</span>
                    PLACE ON WAITING LIST
                </button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant/60 mt-sm">This shuttle is currently at capacity.</p>
</div>
</section>
</main>
<script>
        function selectDate(element) {
            // Remove active classes from all buttons
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-on-surface', 'text-white', 'border-on-surface');
                btn.classList.add('bg-transparent', 'text-on-surface', 'border-on-surface/10');
            });
            
            // Add active classes to selected button
            element.classList.remove('bg-transparent', 'text-on-surface', 'border-on-surface/10');
            element.classList.add('bg-on-surface', 'text-white', 'border-on-surface');
        }

        function toggleCtaState(value) {
            const select = document.getElementById('timeSelect');
            const selectedOption = select.options[select.selectedIndex];
            const isFull = selectedOption.getAttribute('data-status') === 'full';
            
            const confirmCta = document.getElementById('confirmCta');
            const waitlistCta = document.getElementById('waitlistCta');

            if (isFull) {
                confirmCta.classList.add('hidden');
                waitlistCta.classList.remove('hidden');
            } else {
                confirmCta.classList.remove('hidden');
                waitlistCta.classList.add('hidden');
            }
        }
    </script>


</body></html>
