<style>
        body {
            background-color: #ffffff;
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        /* Custom card border style from guidance */
        .high-contrast-card {
            border: 1px solid rgba(19, 46, 81, 0.15);
            background-color: #ffffff;
            transition: border-color 0.2s ease;
        }
        .high-contrast-card:active {
            border-color: #745b00;
        }
        .flat-button-primary {
            background-color: #132e51;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;

<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top App Bar -->

<main class="flex-grow container mx-auto px-margin-mobile pt-lg pb-xl max-w-md">
<!-- Welcome Message -->
<section class="mb-xl text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">
                Welcome, Marshal John
            </h2>
<div class="mt-xs h-1 w-12 bg-primary-container mx-auto"></div>
</section>
<!-- Assigned Stop Card -->
<section class="mb-lg">
<div class="high-contrast-card p-md rounded-xl flex flex-col gap-sm">
<div class="flex items-center justify-between">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Assigned Stop</p>
<h3 class="font-headline-sm text-headline-sm text-on-surface mt-xs">Humewood Station</h3>
</div>
<span class="material-symbols-outlined text-primary text-3xl" data-icon="location_on">location_on</span>
</div>
<button class="flat-button-primary w-full py-md rounded-lg flex justify-center items-center gap-xs mt-base">
<span class="material-symbols-outlined text-body-md" data-icon="near_me">near_me</span>
<span class="font-label-md text-label-md">DIRECTIONS</span>
</button>
</div>
</section>
<!-- Active Boarding Card -->
<section class="mb-xl">
<div class="high-contrast-card p-md rounded-xl">
<div class="flex justify-between items-start mb-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Next Boarding</p>
<span class="px-sm py-xs bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full font-bold">
                        ACTIVE
                    </span>
</div>
<div class="flex items-baseline gap-xs">
<span class="font-display-lg text-display-lg text-on-surface">14:15</span>
<span class="font-label-md text-label-md text-on-surface-variant mb-unit">PM</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="groups">groups</span>
                    Boarding in progress at Platform 2
                </p>
</div>
</section>

<section class="mb-lg">

<div class="h-[1px] flex-grow ml-md bg-outline-variant opacity-30"></div>
</div>
<div class="flex flex-col gap-sm">
<!-- 14:45 -->
<div class="high-contrast-card px-md py-sm rounded-xl flex justify-between items-center">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="schedule">schedule</span>
<span class="font-headline-sm text-headline-sm text-on-surface">14:45</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">IN 30 MIN</span>
</div>

</div>

<script>
        // Simple Micro-interaction for feedback
        document.querySelectorAll('.high-contrast-card').forEach(card => {
            card.addEventListener('click', () => {
                card.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                }, 100);
            });
        });
    </script>
