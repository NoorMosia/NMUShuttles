<style>
      body {
        font-family: 'Hanken Grotesk', sans-serif;
        background-color: #FFFFFF;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
      }
      
      /* Scanning animation line */
      @keyframes scan {
        0%, 100% { top: 10%; }
        50% { top: 90%; }
      }
      .scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: #ffcc00;
        box-shadow: 0 0 15px 2px rgba(255, 204, 0, 0.5);
        animation: scan 3s ease-in-out infinite;
      }

      /* Corner brackets styling */
      .corner {
        position: absolute;
        width: 40px;
        height: 40px;
        border-color: #132e51;
        border-width: 4px;
      }
      .corner-tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
      .corner-tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
      .corner-bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
      .corner-br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
    </style>
<style>
    body {

<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation Area -->

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                // Subtle haptic feedback simulation
                this.classList.add('bg-primary-container/20');
                setTimeout(() => {
                    this.classList.remove('bg-primary-container/20');
                }, 100);
            });
        });

        // Simulating the "scan line" restart or status updates
        setInterval(() => {
            const scanLine = document.querySelector('.scan-line');

            }
        }, 3000);
