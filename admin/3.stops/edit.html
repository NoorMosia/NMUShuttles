<script>
        // Simple micro-interaction for form feedback
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';
            submitBtn.classList.add('opacity-70');
            
            setTimeout(() => {
                submitBtn.innerText = 'Changes Saved!';
                submitBtn.classList.remove('bg-primary-container');
                submitBtn.classList.add('bg-success', 'text-white', 'border-transparent');
                
                // Reset after 2 seconds
                setTimeout(() => {
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                    submitBtn.classList.add('bg-primary-container');
                    submitBtn.classList.remove('bg-success', 'text-white', 'border-transparent', 'opacity-70');
                }, 2000);
            }, 1000);
        });

        // Hover effect for nav items
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                if(!item.classList.contains('font-bold')) {
                    item.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                }
            });
            item.addEventListener('mouseleave', () => {
                if(!item.classList.contains('font-bold')) {
                    item.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                }
            });
        });
    </script>
