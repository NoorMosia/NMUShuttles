<!-- Main Content Canvas -->
<main class="ml-64 min-h-screen pb-32">
<div class="max-w-6xl mx-auto px-lg py-lg">
<!-- Breadcrumbs / Back -->
<button class="flex items-center gap-xs text-on-surface-variant hover:text-on-surface mb-md transition-colors group">
<span class="material-symbols-outlined text-base group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>

<p class="font-body-md text-body-md text-on-surface-variant">Enter personal information and account permissions for the new user</p>
</div>
<!-- Form Layout -->
<div class="grid grid-cols-12 gap-lg">
<div class="col-span-12 lg:col-span-10 space-y-lg">
<section class="shuttle-card bg-surface-container-lowest p-lg rounded-lg">
<div class="flex items-center justify-between mb-lg border-b border-outline-variant pb-xs">

</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-lg gap-y-md">
<!-- Row 1 -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">User ID</label>
<input class="flat-input font-body-md text-body-md opacity-60 pointer-events-none" readonly="" type="text" value=""/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">Name</label>
<input class="flat-input font-body-md text-body-md" type="text" value=""/>
</div>

<label class="font-label-sm text-label-sm text-on-surface-variant">Role</label>
<select class="flat-input font-body-md text-body-md appearance-none cursor-pointer"><option disabled="" selected="" value="">Select Role</option>
<option value="Student">Student</option>
<option value="Marshal">Marshal</option>
<option value="Admin">Admin</option>
</select>
</div>
<div class="flex flex-col gap-xs mt-[40px]">
<label class="font-label-sm text-label-sm text-on-surface-variant">Email</label>
<input class="flat-input font-body-md text-body-md" placeholder="s123456789@mandela.ac.za" type="email" value=""/>
</div>

<label class="font-label-sm text-label-sm text-on-surface-variant">Status</label>
<div class="flex items-center justify-between flat-input font-body-md text-body-md py-base">
<span class="text-on-surface" id="status-label">Active</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" onchange="document.getElementById('status-label').textContent = this.checked ? 'Active' : 'Inactive'" type="checkbox"/>
<div class="w-10 h-5 bg-surface-container-high rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface-variant after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#ffcc00] peer-checked:after:bg-[#132e51]"></div>

</footer>
<script>
        // Micro-interactions for form feedback
        document.querySelectorAll('.flat-input').forEach(input => {
            input.addEventListener('focus', () => {
                const label = input.parentElement.querySelector('label');
                if (label) label.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                const label = input.parentElement.querySelector('label');
                if (label) label.classList.remove('text-primary');
            });
        });
    </script>
