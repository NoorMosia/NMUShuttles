<body class="bg-white min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-30 bg-white border-b border-outline-variant flex justify-between items-center px-margin-mobile py-base h-16">
<div class="flex items-center gap-4">
<button class="active:opacity-80 transition-opacity hover:bg-surface-container-low p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm font-semibold text-on-surface">Search</h1>
</div>
<div class="flex items-center">

</div>
</header>
<main class="flex-grow px-margin-mobile pt-lg flex flex-col gap-xl">

<section class="flex flex-col gap-sm">
<div class="relative flex items-center w-full border-2 border-primary rounded-xl px-sm h-14 bg-white transition-all">
<span class="material-symbols-outlined text-primary mr-sm" data-icon="search">search</span>
<div class="flex flex-grow items-center relative h-full">

<div class="custom-cursor ml-0.5"></div>
</div>
<button class="ml-sm text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</section>
<!-- Search Results Section -->
<section class="flex flex-col">
<div class="mb-sm px-xs">
<h2 class="font-label-md text-on-surface-variant uppercase tracking-widest text-[10px]">Suggested Stops</h2>
</div>
<div class="flex flex-col">
<!-- Result Item 1 -->
<button class="flex items-center py-md border-b border-outline-variant/30 active:bg-surface-container-low transition-colors w-full text-left group">
<div class="bg-surface-container p-2 rounded-xl mr-sm group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="push_pin">push_pin</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg font-semibold text-on-surface">North Campus Hub</span>

</div>
</button>
<!-- Result Item 2 -->
<button class="flex items-center py-md border-b border-outline-variant/30 active:bg-surface-container-low transition-colors w-full text-left group">

<span class="material-symbols-outlined text-on-surface-variant" data-icon="push_pin">push_pin</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg font-semibold text-on-surface">South Library Entrance</span>
<span class="font-label-sm text-on-surface-variant">Main Plaza walkway</span>
</div>
</button>
<!-- Result Item 3 -->
<button class="flex items-center py-md border-b border-outline-variant/30 active:bg-surface-container-low transition-colors w-full text-left group">
<div class="bg-surface-container p-2 rounded-xl mr-sm group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="push_pin">push_pin</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg font-semibold text-on-surface">Medical School Annex</span>
<span class="font-label-sm text-on-surface-variant">Beside Hospital West Wing</span>
</div>
</button>
<!-- Result Item 4 (Bonus for density) -->
<button class="flex items-center py-md border-b border-outline-variant/30 active:bg-surface-container-low transition-colors w-full text-left group">
<div class="bg-surface-container p-2 rounded-xl mr-sm group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="push_pin">push_pin</span>
</div>
<div class="flex flex-col">
<span class="font-body-lg font-semibold text-on-surface">Student Union Square</span>
<span class="font-label-sm text-on-surface-variant">Central Hub Terminal</span>
</div>

</div>
</section>
<!-- Illustration / Empty State Subtle visual -->
<section class="mt-xl flex flex-col items-center justify-center opacity-40">
<div class="w-full h-32 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-surface-variant/20" data-icon="directions_bus" style="font-variation-settings: &quot;wght&quot; 200;">directions_bus</span>
</div>
<p class="font-label-sm text-on-surface-variant text-center max-w-[200px]">Quickly find routes and stops across the entire campus ecosystem.</p>

</a></nav>
<script>
        // Simple micro-interaction for clearing the search bar
        document.querySelector('[data-icon="close"]').parentElement.addEventListener('click', () => {
            const inputContainer = document.querySelector('.font-body-md.text-on-surface-variant\\/40');
            if (inputContainer) {
                inputContainer.textContent = 'Search...';
            }
        });
        
        // Selection ripple effect simulation
        const buttons = document.querySelectorAll('button');
        buttons.forEach(button => {
            button.addEventListener('mousedown', function(e) {
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;
            });
        });
    </script>
