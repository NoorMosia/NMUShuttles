<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin Login - Step 1</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="typography">
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:wght@700&family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Styling for the specific broken 'Login' title text */
    .title-login {
      font-family: 'Crimson Text', serif;
      font-size: 2.5rem;
      line-height: 1.1;
      color: #1a1a1a;
    }
  </style>
<style data-purpose="custom-layout">
    /* Ensure the main container takes full viewport height for centering */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
    }

    /* Fixed width for the form container to match desktop screenshot aspect */
    .form-container {
      width: 100%;
      max-width: 450px;
      padding: 2rem;
      text-align: center;
    }

    /* Custom input styling to remove default borders and keep only bottom border */
    .custom-input {
      border: none !important;
      border-bottom: 1px solid #d1d5db !important;
      border-radius: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      box-shadow: none !important;
    }
    
    .custom-input:focus {
      border-bottom-color: #facc15 !important;
      outline: none !important;
    }
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@700&amp;family=Inter:wght@400;500;600&amp;display=swap" data-snapdom="injected-import"></head>
<body>
<!-- BEGIN: Main Login Section -->
<main class="login-wrapper" data-purpose="login-screen-container">
<div class="form-container" data-purpose="login-form-box">
<!-- BEGIN: Branding/Logo -->
<div class="mb-8 flex justify-center">
<div class="w-48 h-48 bg-[#facc15] overflow-hidden" data-purpose="brand-logo-container">
<img alt="Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWVW9e7MUqVEjrDieFknPtW1q29tE_jsp3vf0T68UD7M47hG0Th1fZDuhTG9W4F7p4mnqtDghEuwOd8l586c5QAm3CoMcjc9iqfulifFePz_vvCbhtiC8gEADuMS-L621bUxEBFTWDS6BgHulRnXKI9gBxxdTyYj3Kf_PCFn1zhwZ_HA0hhe7I_Fl9Qhaa7Jaks_gHSJqHKRccW51LKVnWbcMztnk5sM0YD5BLY0CDg5aVBAoD8xRB1vRTGpvnupNzWXQuP0TYVih4">
</div>
</div>
<!-- END: Branding/Logo -->
<!-- BEGIN: Title Section -->
<div class="mb-10 text-center" data-purpose="title-section">
<h1 class="text-[40px] font-bold leading-[48px] tracking-[-0.02em] text-on-surface whitespace-nowrap">Login</h1>
</div>
<!-- END: Title Section -->
<!-- BEGIN: Login Form -->
<form action="#" class="space-y-8" method="POST">
<div class="text-left" data-purpose="input-group">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1" for="staff_number">
            Staff Number
          </label>
<input class="custom-input w-full py-2 text-sm text-gray-700 placeholder-gray-400" id="staff_number" name="staff_number" placeholder="e.g. ST12345678" required="" type="text">
</div>
<div data-purpose="action-button">
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg hover:bg-[#e6b800] active:opacity-80 transition-all duration-150 flex items-center justify-center tracking-wider uppercase" type="submit" style="background-color: #ffcc00; color: #000000; border-radius: 5px; box-shadow: none;">
            GET OTP
          </button>
</div>
</form>
<!-- END: Login Form -->
<!-- BEGIN: Footer Links -->
<div class="mt-8" data-purpose="footer-links">
<p class="font-label-sm text-label-sm text-on-surface-variant">
          Don't have access? <a class="font-label-sm text-primary hover:underline transition-all" href="#">Contact IT</a>
</p>
</div>
<!-- END: Footer Links -->
</div>
</main>
<!-- END: Main Login Section -->


</body></html>
