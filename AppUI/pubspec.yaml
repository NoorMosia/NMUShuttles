name: nmu_shuttle_app
description: NMU Shuttle Management Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^14.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^7.4.2
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.0
  geolocator: ^11.0.0
  jwt_decoder: ^2.0.1
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logos/
    - assets/logos/by4sp_net.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/1.png"
  adaptive_icon_background: "#132e51"
  adaptive_icon_foreground: "assets/logos/1.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/logos/1.png
  color_dark: "#ffffff"
  image_dark: assets/logos/1.png
  android: true
  ios: false
  android_12:
    image: assets/logos/1.png
    icon_background_color: "#ffffff"
    image_dark: assets/logos/1.png
    icon_background_color_dark: "#ffffff"
