<!-- Atmospheric Micro-interactions -->
<script>
        // Simple logic to simulate GPS movement slightly or pulse updates
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Live navigation active.");
            
            // Randomly update the distance every few seconds to simulate movement
            const distanceEl = document.querySelector('.text-label-md.text-on-surface-variant');
            let currentDist = 450;
            
            setInterval(() => {
                if (currentDist > 10) {
                    currentDist -= Math.floor(Math.random() * 5);
                    distanceEl.textContent = `${currentDist} meters remaining`;
                }
            }, 5000);
        });
    </script>
