                    "primary-container": "#ffcc00",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #ffffff;
            color: #1f1b10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- Top Navigation Bar -->
<header class="w-full top-0 bg-surface flex justify-between items-center px-margin-mobile py-sm border-b border-outline-variant/20 z-50 sticky">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">Booking Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow px-margin-mobile py-lg max-w-md mx-auto w-full pb-xl">
<!-- Section 1: Trip Details -->
<section class="mb-lg">
<div class="flex items-start gap-md p-md border border-on-surface/10 rounded-lg bg-surface-container-lowest border-outline-variant/30">
<div class="flex flex-col items-center gap-1 mt-1">
<div class="w-3 h-3 rounded-full border-2 border-primary"></div>
<div class="w-0.5 h-12 bg-outline-variant"></div>
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
<div class="flex flex-col gap-4">
<div>
<p class="font-label-sm text-on-surface-variant uppercase tracking-wider">From</p>
<p class="font-headline-sm text-headline-sm text-on-surface">South</p>
</div>
<div>
<p class="font-label-sm text-on-surface-variant uppercase tracking-wider">To</p>
<p class="font-headline-sm text-headline-sm text-on-surface">Humewood</p>
</div>
</div>
</div>
<div class="mt-md flex items-center gap-sm p-sm border border-on-surface/10 rounded-lg">
<span class="material-symbols-outlined text-primary">calendar_today</span>
<p class="font-label-md text-label-md text-on-surface">Today, 2:00 PM</p>
</div>
</section>
<!-- Section 2: QR Code -->
<section class="mb-xl flex flex-col items-center">
<div class="p-md bg-white border-2 border-on-surface/10 rounded-xl">
<div class="aspect-square w-64 flex items-center justify-center bg-white">
<!-- QR Code Placeholder -->
<img alt="QR Code" class="w-full h-full object-contain" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
</div>
</div>
<p class="mt-sm font-label-sm text-on-surface-variant text-center">Scan this code at the shuttle entry</p>
</section>
<!-- Section 3: Buttons -->
<section class="flex flex-col gap-md">
<button class="w-full py-md bg-primary-container text-on-primary-container font-label-md text-label-md rounded-[5px] active:bg-primary transition-colors flex items-center justify-center gap-sm" style="transform: scale(1);">
<span class="material-symbols-outlined">download</span>
                Download QR Code
            </button>
<button class="w-full py-md border-2 border-error text-error font-label-md text-label-md rounded-[5px] active:bg-error/10 transition-colors flex items-center justify-center gap-sm" style="transform: scale(1);">
<span class="material-symbols-outlined">cancel</span>
                Cancel Booking
            </button>
</section>
</main>
<!-- Bottom Navigation Bar -->

<!-- Spacing for Bottom Bar -->

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.98)');
            btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
            btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
        });
    </script>








</body></html>
